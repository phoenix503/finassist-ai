services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: finassist-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: finassist
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local environment}
      POSTGRES_DB: finassist
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
